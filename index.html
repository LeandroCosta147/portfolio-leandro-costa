<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leandro Costa | Portfólio – Análise de Dados e Desenvolvimento Web</title>
<meta name="description" content="Portfólio de Leandro Costa, estudante de Ciência da Computação apaixonado por Análise de Dados, Power BI, Python e Desenvolvimento Web.">
<meta property="og:type" content="website">
<meta property="og:title" content="Leandro Costa | Portfólio">
<meta property="og:description" content="Análise de Dados, Power BI, Python e Desenvolvimento Web.">

<meta name="theme-color" content="#0B1120">
<meta name="color-scheme" content="dark">
<style>
:root{--cy:#38BDF8;--cy2:#06B6D4;--bl:#2563EB;--bl2:#3B82F6;--bg:#0B1120;--bg2:#0F172A;--tx:#94A3B8;--glass:rgba(255,255,255,.05);--bd:rgba(148,163,184,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);line-height:1.7;background:radial-gradient(60vw 60vw at 90% -5%,rgba(37,99,235,.28),transparent 60%),radial-gradient(50vw 50vw at -10% 35%,rgba(6,182,212,.16),transparent 60%),radial-gradient(60vw 60vw at 100% 80%,rgba(37,99,235,.2),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:76px 0}
h1,h2,h3{color:#fff}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem);margin-bottom:30px;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--cy),transparent);opacity:.5}
h3{font-size:1.15rem}
header{position:sticky;top:0;z-index:10;background:rgba(11,17,32,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-weight:800;color:#fff;font-size:1.15rem}
.logo span{color:var(--cy);text-shadow:0 0 18px rgba(56,189,248,.7)}
nav ul{display:none;list-style:none;gap:24px;font-size:.92rem;font-weight:500}
nav a{transition:color .2s}nav a:hover{color:var(--cy)}
.lang{display:flex;background:var(--glass);border:1px solid var(--bd);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font:600 .8rem inherit;font-family:inherit;padding:5px 13px;border-radius:99px;cursor:pointer;color:var(--tx);transition:.2s}
.lang button[aria-pressed=true]{background:linear-gradient(135deg,var(--cy2),var(--bl));color:#fff;box-shadow:0 0 14px rgba(56,189,248,.5)}
.menu-links{display:flex;gap:16px;overflow-x:auto;padding:0 0 10px;font-size:.85rem;scrollbar-width:none}
.menu-links a{white-space:nowrap}
.hero{padding:56px 0 80px}
.hero .wrap{display:grid;gap:40px;align-items:center}
.ring{width:min(280px,72vw);aspect-ratio:1;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,var(--cy),var(--bl),var(--cy2),var(--cy));box-shadow:0 0 40px rgba(56,189,248,.45),0 0 90px rgba(37,99,235,.35);justify-self:center;order:-1;transition:box-shadow .3s}
.ring:hover{box-shadow:0 0 60px rgba(56,189,248,.7),0 0 120px rgba(37,99,235,.5)}
.photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 50%;border:5px solid var(--bg);display:block}
h1{font-size:clamp(2.1rem,7.5vw,3.6rem);line-height:1.1;letter-spacing:-.03em;margin-bottom:18px}
h1 em{font-style:normal;color:var(--cy);text-shadow:0 0 28px rgba(56,189,248,.55)}
.sub{font-size:1.05rem;max-width:34em;margin-bottom:30px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:12px;font-weight:600;font-size:.95rem;border:1px solid var(--cy);transition:transform .15s,box-shadow .25s,background .25s;color:#fff}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.p{background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04141F;border-color:transparent;box-shadow:0 0 22px rgba(56,189,248,.5)}
.btn.p:hover{box-shadow:0 0 38px rgba(56,189,248,.85);transform:translateY(-2px)}
.btn.s{background:var(--glass);backdrop-filter:blur(8px)}
.btn.s:hover{background:rgba(56,189,248,.15);box-shadow:0 0 22px rgba(56,189,248,.35);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.about p{max-width:68ch;margin-bottom:16px}
.about article{background:var(--glass);border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:16px;padding:26px;backdrop-filter:blur(10px)}
.grid{display:grid;gap:18px}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:var(--cy);box-shadow:0 0 30px rgba(56,189,248,.28),inset 0 0 24px rgba(37,99,235,.12)}
.ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;font-size:1.5rem;background:linear-gradient(135deg,rgba(6,182,212,.3),rgba(37,99,235,.3));border:1px solid var(--bd);margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{background:rgba(37,99,235,.2);border:1px solid rgba(59,130,246,.4);color:#BAE6FD;padding:4px 12px;border-radius:99px;font-size:.82rem;font-weight:600}
.proj{display:flex;flex-direction:column;background:linear-gradient(160deg,rgba(15,23,42,.9),rgba(11,17,32,.9));border-color:rgba(59,130,246,.45);box-shadow:0 0 18px rgba(37,99,235,.18)}
.cat{margin:6px 0 16px;font-size:1.05rem;color:var(--cy)}
.grid+.cat{margin-top:40px}
.proj p{margin:10px 0 20px}
.proj .btn{margin-top:auto;align-self:flex-start}
.badge{font-size:.78rem;font-weight:700;color:var(--cy);margin-bottom:8px}
.btn.off{opacity:.5;border-style:dashed;pointer-events:none;background:none;box-shadow:none;color:var(--tx)}
.hob{text-align:center;padding:22px 14px}
.hob b{display:block;font-size:2.2rem;margin-bottom:6px;transition:transform .25s}
.hob:hover b{transform:scale(1.18) rotate(-6deg)}
.hob span{font-weight:600;color:#fff;font-size:.93rem;line-height:1.4;display:block}
.goal{position:relative;overflow:hidden;border-radius:20px;padding:40px 28px;color:#fff;font-size:clamp(1.15rem,3vw,1.55rem);line-height:1.5;font-weight:600;background:linear-gradient(135deg,rgba(37,99,235,.35),rgba(6,182,212,.18));border:1px solid var(--cy);box-shadow:0 0 40px rgba(56,189,248,.25),inset 0 0 50px rgba(56,189,248,.08)}
.goal::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%)}
.contact{text-align:center}
.contact p{max-width:46ch;margin:0 auto 26px}
.contact h2{justify-content:center}.contact h2::after{display:none}
.contact .btns{justify-content:center}
footer{border-top:1px solid var(--bd);text-align:center;padding:24px 20px;font-size:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g5{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){nav ul{display:flex}.menu-links{display:none}
.hero .wrap{grid-template-columns:1.3fr 1fr}.ring{order:0;width:min(340px,100%)}
.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
