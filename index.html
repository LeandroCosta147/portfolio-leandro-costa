<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leandro Costa | Portfólio</title>
<meta name="description" content="Portfólio de Leandro Costa, estudante de Ciência da Computação.">
<meta name="theme-color" content="#0B1120">
<style>
:root {
  --cy:#38BDF8;
  --cy2:#06B6D4;
  --bl:#2563EB;
  --bg:#0B1120;
  --bg2:#0F172A;
  --tx:#94A3B8;
  --bd:rgba(148,163,184,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--tx);line-height:1.7;
  background:radial-gradient(60vw 60vw at 90% -5%,rgba(37,99,235,.28),transparent 60%),
  radial-gradient(50vw 50vw at -10% 35%,rgba(6,182,212,.16),transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2));
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
section{padding:76px 0}
h1,h2,h3{color:white}
h2{font-size:2rem;margin-bottom:28px}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(11,17,32,.9);
  border-bottom:1px solid var(--bd);
}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px}
.logo{font-weight:800;color:white;font-size:1.15rem}
.logo span,h1 em{color:var(--cy)}
nav ul{display:flex;list-style:none;gap:18px;font-size:.9rem}
nav a:hover{color:var(--cy)}
.lang{display:flex;gap:4px}
.lang button{
  padding:6px 12px;border:1px solid var(--bd);
  border-radius:20px;background:transparent;color:white;cursor:pointer
}
.lang button[aria-pressed=true]{background:var(--bl)}
.menu-links{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;font-size:.85rem}
.menu-links a{white-space:nowrap}
.hero{padding:70px 0}
.hero .wrap{display:grid;gap:40px;align-items:center}
.ring{
  width:min(300px,75vw);aspect-ratio:1;border-radius:50%;padding:5px;
  background:conic-gradient(var(--cy),var(--bl),var(--cy2),var(--cy));
  box-shadow:0 0 45px rgba(56,189,248,.35);
  justify-self:center;
}
.photo{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  object-position:50% 20%;border:5px solid var(--bg);display:block
}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.15;margin-bottom:18px}
.sub{font-size:1.05rem;margin-bottom:25px;max-width:600px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:12px 20px;border-radius:12px;font-weight:600;
  border:1px solid var(--cy);color:white
}
.btn.p{background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04141F;border:0}
.btn.s{background:rgba(255,255,255,.05)}
article.card,.about article{
  background:rgba(255,255,255,.04);border:1px solid var(--bd);
  border-radius:16px;padding:24px
}
.about p{margin-bottom:14px}
.grid{display:grid;gap:18px}
.g2,.g3,.g5{grid-template-columns:1fr}
.card h3{margin-bottom:10px}
.ic{font-size:1.5rem;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tags span{
  padding:4px 10px;border-radius:20px;
  background:rgba(37,99,235,.2);color:#BAE6FD;font-size:.85rem
}
.cat{color:var(--cy);margin:22px 0 14px}
.proj p{margin:10px 0 18px}
.badge{font-size:.8rem;color:var(--cy);margin-bottom:8px}
.hob{text-align:center}
.hob b{display:block;font-size:2rem}
.hob span{color:white;font-weight:600}
.goal{
  padding:30px;border-radius:18px;color:white;font-size:1.3rem;
  background:linear-gradient(135deg,rgba(37,99,235,.35),rgba(6,182,212,.15));
  border:1px solid var(--cy)
}
.contact{text-align:center}
.contact h2{margin-bottom:15px}
footer{border-top:1px solid var(--bd);text-align:center;padding:24px}
@media(min-width:640px){
  .g2{grid-template-columns:repeat(2,1fr)}
  .g5{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:860px){
  nav ul{display:flex}
  .menu-links{display:none}
  .hero .wrap{grid-template-columns:1.3fr 1fr}
  .ring{width:min(340px,100%)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:859px){nav ul{display:none}}
</style>
</head>
